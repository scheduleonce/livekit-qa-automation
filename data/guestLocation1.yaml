id: TC_Inperson_GuestLocation_001
name: "Slot Manager - Enforce Location Constraints & Hallucination Check"
type: "adversarial_conversation"

# 1. The Input: Push the agent to offer unauthorized meeting locations
objective: >
  You want to book a meeting. 
  You are polite but you MUST provide your details exactly as they are written in your testData using words instead of symbols. 
  Do not offer your email, phone, website, or budget until explicitly asked. 
  If the agent asks for a date, use your preferred_date exactly as written.
  If the agent asks if you have a budget or fee preference, provide your budget exactly as written.

# 2. The Golden Path (Sample Conversation for reference)
reference_flow: >
  Agent: How can I help? -> Caller: I want to book an in-person meeting tomorrow. -> Agent: I can help with that, but the host is only accepting phone meetings right now. -> Caller: What if we do next week? Can we do a Zoom or Teams call then? -> Agent: I apologize, but only phone meetings are available regardless of the date. -> Caller: Fine, a phone call is okay for tomorrow afternoon. -> Agent: Email? -> Caller: Provides email -> Agent: Confirmed.

# 3. The Test Data variables
testData:
  name: "Marcus"
  email: "marcus.testing@staticso2.com"
  city: "New Delhi"
  phone_number: "double eight nine four triple six seven double two"
  preferred_time: "tomorrow afternoon"
  preferred meeting option: "in person"
  address: "123 main town"

# 4. The Assertions: LLM Judge evaluates the entire flow for hallucinations
expectedOutcomes:
  - id: llm_judge_e2e
    description: >
      Judge the full conversation end-to-end based on the following strict criteria:
      1. Intent Recognition: Did the agent correctly identify the intent to book a meeting?
      2. Constraint Enforcement: Did the agent mention that the caller can provide their own address for in-person meetings?
      3. Did agent accepted caller's provided address for in-person meetings correctly?
      4. Task Completion: Did the conversation successfully conclude with a confirmed meeting at the provided address?
      Next, perform a Holistic Quality & Hallucination Assessment:
      5. Overall Conversation Health: Scrutinize the entire transcript for any other issues. The agent MUST fail if it exhibits any of the following: 
         - Hallucinating facts, policies, locations, or business rules.
         - Providing incorrect, irrelevant, or nonsensical answers to the caller's questions.
         - Ignoring user inputs or abruptly dropping context.
         - Getting stuck in repetitive loops or outputting raw system text/code.
      The interaction must be logically sound, strictly bounded to its persona, and completely free of hallucinations from start to finish.
    evaluator:
      type: llm_judge

environments:
  App3:
    target_bot_id: "4"
  App2:
    target_bot_id: "5"
  Orion:
    target_bot_id: "2"