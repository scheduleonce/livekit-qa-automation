id: TC_BWA_001
name: "Basic successful booking request submitted for approval"
type: "e2e_conversation"

# 1. The Input (Simulated User Prompt)
objective: >
  You want to book a meeting. 
  You are polite but you MUST provide your details exactly as they are written in your testData using words instead of symbols. 
  Do not offer your email, phone, website, or budget until explicitly asked. 
  If the agent asks for a date, use your preferred_date exactly as written.
  If the agent asks if you have a budget or fee preference, provide your budget exactly as written.

  EMAIL CAPTURE RULES & CONFIRMATION LOGIC:
      - When asked for your email, state it clearly as written in testData: "daniel7@staticso2.com".
      - Do NOT spell it out letter by letter on the first attempt, even if the agent invites you to spell it.
      
      EVALUATING AGENT CONFIRMATION:
      - When the agent attempts to confirm or repeat your email (whether as a full string, spelled out, or using phonetic words like "D as in Delta"), decode their spelling and compare it against testData.email ("daniel7@staticso2.com").
      - If the spelled-out characters match "daniel7@staticso2.com" exactly, respond with: "Yes, that is correct."
      - ONLY say "No" if the agent made an actual mistake (e.g., missed a letter, got a number wrong, or got the domain wrong).
      
      FALLBACK (ONLY IF WRONG):
      - If and only if the agent states an incorrect email, say "No, that is incorrect" and spell out the letters slowly in a single response (e.g., "d a n i e l 7 at s t a t i c s o 2 dot com").
      - Do NOT send or speak hyphenation or punctuation characters unless explicitly asked.
  
# 2. The Golden Path (Sample Conversation for reference)
reference_flow: >
  Agent: How can I help? -> Caller: Book a demo. -> Agent: share your city or timezone? -> Caller: i am in eastern timezone. -> Agent: When? -> Caller: Wednesday 10AM. -> Agent: Email? -> Caller: Provides email -> Agent: phone number? -> Caller: Provides phone number -> Agent: Confirmed.

# 3. The Test Data variables
testData:
  name: "Henry George"
  email: "henry8@staticso2.com"
  city: "Bangalore"
  phone_number: "8887635621"
  phone_call_number: "7780043170"
  preferred_time: "Next week"
  preferred meeting option: "phone"
  company_name: "Vedanta"
  budget: "thirty thousand dollars"

# 4. The Assertions: LLM Judge evaluates the entire flow for hallucinations
expectedOutcomes:
  - id: llm_judge_e2e
    description: >
      Judge the full conversation end-to-end based on the following strict criteria:
      1. Intent Recognition: Did the agent correctly identify the intent to book a meeting?
      2. Constraint Enforcement: Did the agent strictly enforce that ONLY 'phone' meetings are available?
      3. Task Completion: Did the conversation conclude with the agent successfully submitting a booking request for a phone meeting? The agent must clearly communicate that the appointment is requested/pending, and MUST NOT falsely claim or guarantee that the booking is finalized or 'successfully confirmed'.
      Next, perform a Holistic Quality & Hallucination Assessment:
      4. Overall Conversation Health: Scrutinize the entire transcript for any other issues. The agent MUST fail if it exhibits any of the following: 
         - Hallucinating facts, policies, locations, or business rules.
         - Providing incorrect, irrelevant, or nonsensical answers to the caller's questions.
         - Ignoring user inputs or abruptly dropping context.
         - Getting stuck in repetitive loops or outputting raw system text/code.
      The interaction must be logically sound, strictly bounded to its persona, and completely free of hallucinations from start to finish.
    evaluator:
      type: llm_judge

environments:
  App3:
    target_bot_id: "3"
  App2:
    target_bot_id: "4"
  Orion:
    target_bot_id: "2"