id: TC_SCHED_ONLINE_001
name: "Basic successful appointment booking"
type: "e2e_conversation"

# 1. The Input (Simulated User Prompt)
objective: >
  You want to book a meeting. 
  You are polite but you MUST provide your details exactly as they are written in your testData using words instead of symbols. 
  Do not offer your email, phone, website, or budget until explicitly asked. 
  If the agent asks for a date, use your preferred_date exactly as written.
  If the agent asks if you have a budget or fee preference, provide your budget exactly as written.

  EMAIL CAPTURE RULES & CONFIRMATION LOGIC:
      - When asked for your email, state it clearly as written in testData.email.
      - Do NOT spell it out letter by letter on the first attempt, even if the agent invites you to spell it.
      
      EVALUATING AGENT CONFIRMATION:
      - When the agent attempts to confirm or repeat your email (whether as a full string, spelled out, or using phonetic words like "D as in Delta"), decode their spelling and compare it against testData.email.
      - If the spelled-out characters match testData.email exactly, respond with: "Yes, that is correct."
      - ONLY say "No" if the agent made an actual mistake (e.g., missed a letter, got a number wrong, or got the domain wrong).
      
      FALLBACK (ONLY IF WRONG):
      - If and only if the agent states an incorrect email, say "No, that is incorrect" and spell out the letters slowly in a single response (e.g., "d a n i e l 7 at s t a t i c s o 2 dot com").
      - Do NOT send or speak hyphenation or punctuation characters unless explicitly asked.
  
# 2. The Golden Path (Sample Conversation for reference)
reference_flow: >
  Agent: How can I help? -> Caller: Book a demo. -> Agent: share your city or timezone? -> Caller: i am in eastern timezone. -> Agent: When? -> Caller: Wednesday 10AM. -> Agent: Email? -> Caller: Provides email -> Agent: phone number? -> Caller: Provides phone number -> Agent: Confirmed.

# 3. The Test Data variables
testData:
  name: "James peter"
  email: "james@staticso2.com"
  city: "New Delhi"
  phone_number: "9847635355"
  preferred_time: "Tomorrow at the earliest time possible"
  preferred meeting option: "online"
  preferred_duration: "30 minutes"
  company_name: "Vedanta"
  budget: "thirty thousand dollars"

# 4. The Assertions: Comprehensive LLM Judge Evaluation
expectedOutcomes:
  - id: llm_judge
    description: >
      Judge the full conversation end-to-end based on the following strict criteria:
      
      1. Intent & Preferences: 
         - Did the agent correctly identify the intent to schedule a meeting?
         - Did the agent correctly capture the requested duration (30 minutes) and location preference (online)?
      
      2. Time Slot Negotiation & Consistency (CRITICAL):
         - Did the agent suggest a specific time slot based on the user's availability?
         - Did the final confirmed meeting time strictly match the specific time slot that was negotiated and agreed upon earlier in the call? 
      
      3. Contact Information Capture & Correction Handling:
         - Name: Did the agent ask for and correctly confirm the caller's first and last name?
         - Email capture: Did the agent asked for email and captured email correctly?
         - Phone: Did the agent ask for the phone number and confirm it properly (including formatting with country codes like +91)?
      
      4. Custom Qualification Questions:
         - Did the agent successfully ask for and capture the SMS notification preference?
         
      5. Task Completion & Specific Result Output:
         - Did the conversation successfully conclude with a confirmed meeting? 
         - In your evaluation result, you MUST explicitly state the meeting details in this exact format based on the transcript: "(online meeting was successfully confirmed for [Day], [Date], at [Time] [Timezone])."
         
      6. Holistic Quality & Hallucination Assessment:
         - Scrutinize the entire transcript for any hallucinations. The interaction must be logically sound, strictly bounded to its persona, and completely free of hallucinated times, dates, or contact details.
    evaluator:
      type: llm_judge

environments:
  App3:
    target_bot_id: "6" #previous value - 2
  App2:
    target_bot_id: "1"
  Orion:
    target_bot_id: "4"
  Prod:
    target_bot_id: "3"